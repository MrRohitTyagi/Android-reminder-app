name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - '*'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk PasswordKeeper-Alarm.apk

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: PasswordKeeper-Alarm-APK
          path: PasswordKeeper-Alarm.apk
          retention-days: 14

      - name: Upload APK to Release Assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PasswordKeeper-Alarm.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
